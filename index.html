button{cursor:pointer;border:0;font-weight:700;color:#fff;background:linear-gradient(135deg,#1f7a49,#124d2f);box-shadow:0 8px 16px -8px rgba(6,50,30,.6)}

.c{position:relative;background:linear-gradient(180deg,#eefaf3 0,#fff 44px,#fbfefc);border-radius:1.5rem;padding:1.1rem;margin:0 0 1.1rem;overflow-x:auto;box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(23,98,59,.06),0 2px 6px rgba(6,50,30,.04),0 26px 48px -26px rgba(6,50,30,.3);animation:f .35s ease}

.p{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.1rem}.p button{background:#fff;color:var(--g);border:1px solid var(--b);box-shadow:none;border-radius:99px;padding:.4rem 1rem}.p button.on{background:linear-gradient(135deg,#1f7a49,#124d2f);color:#fff;border:0;box-shadow:0 8px 16px -8px rgba(6,50,30,.6)}

 let h=`<div class="c"><input id="f" placeholder="Bilatu bikotea edo kategoria..." value="${esc(f)}" oninput="A.f(this.value)"> <button class="o" onclick="A.past()">${past?'Gaurtik aurrera':'Pasatakoak ere'}</button></div>`;
 if(admin)h+=`<div class="c"><h3>Antolaketa</h3>Egunak sortu (astelehenetik ostiralera): <input type="date" id="fr"> – <input type="date" id="to"> <select id="st"><option>16:30</option><option>15:00</option></select> <button onclick="A.addD()">Sortu</button><br><br>
  Auto-bete hemendik: <input type="date" id="af" value="${today()}"> <button onclick="A.auto()">Auto-bete</button> <span class="m">Esleitu gabeko partidak: ${pn.length}</span></div>`;
 if(!ds.length)h+='<div class="c m">Ez dago egunik antolatuta.</div>';
 return h+ds.map(d=>{const x=D[d],ms=all().filter(m=>m.day==d),pl=new Set(ms.flatMap(m=>m.t)),ok=m=>!f||(tn(m.t[0])+' '+tn(m.t[1])+' '+m.cat).toLowerCase().includes(f);
  let b='';if(x.off)b=`<div class="off">Frontoia okupatuta${x.note?': '+esc(x.note):''}</div>`;else b=slotsFor(d).map(s=>{const m=ms.find(m=>m.slot==s);if(!admin&&(!m||!ok(m)))return'';
   const o=pn.filter(p=>p.t.every(t=>!pl.has(t)&&t!=x.ep)).map(p=>`<option value="${p.id}">${p.cat} · ${esc(tn(p.t[0]))} vs ${esc(tn(p.t[1]))}</option>`).join('');
   return `<div class="r"><span class="t">${s}</span>${admin?`<select onchange="A.as('${d}','${s}',this.value)"><option value="">Hutsik</option>${m?`<option value="${m.id}" selected>${m.cat} · ${esc(tn(m.t[0]))} vs ${esc(tn(m.t[1]))}</option>`:''}${o}</select>${m?sc(m,true):''}`:m?`<span class="bd">${m.cat}${m.group?' '+m.group:''}</span><span>${esc(tn(m.t[0]))} <span class="m">vs</span> ${esc(tn(m.t[1]))}</span>${sc(m,false)}`:''}</div>`}).join('');
  return `<div class="c"><h2>${fd(d)}${d==today()?' · gaur':''}</h2><div class="m">Epailea: <b>${x.ep?esc(tn(x.ep)):'zozkatu gabe'}</b> ${admin?`<button class="o" onclick="A.ep('${d}')">Zozkatu</button> Hasiera <select onchange="A.day('${d}','start',this.value)"><option ${x.start!='15:00'?'selected':''}>16:30</option><option ${x.start=='15:00'?'selected':''}>15:00</option></select> <label><input type="checkbox" ${x.off?'checked':''} onchange="A.day('${d}','off',this.checked)"> Okupatuta</label> <input value="${esc(x.note||'')}" placeholder="Oharra" onchange="A.day('${d}','note',this.value)" size="12"> <button class="o" onclick="A.dd('${d}')">✕</button>`:''}</div>${b}</div>`}).join('')}
function vK(){const R_=R(cat);let h=pills(CATS,cat,'A.cat');if(R_<1)return h+'<div class="c m">Kanporaketa oraindik ez da sortu.</div>';
 const ms=all().filter(m=>m.cat==cat&&m.phase=='k'),nm=n=>n==1?'Finala':n==2?'Finalerdiak':n==4?'Final-laurdenak':n*2+' bikote',
 card=m=>{const[a,b]=m.t,w=played(m)?(m.sa>m.sb?a:b):null,row=(t,k)=>`<div class="tr ${w&&w==t?'w':''}"><span>${t?esc(tn(t)):'—'}</span>${admin&&a&&b?`<input type="number" min="0" max="30" value="${m[k]??''}" onchange="A.sc('${m.id}','${k}',this.value)">`:`<b>${m[k]??''}</b>`}</div>`;
  return `<div class="mc">${row(a,'sa')}${row(b,'sb')}${m.day?`<div class="m" style="padding:.2rem .6rem">${fd(m.day)} · ${m.slot}</div>`:''}</div>`};
 let cols='';for(let r=0;r<R_;r++){const L=ms.filter(m=>m.r===r).sort((x,y)=>x.i-y.i);cols+=`<div class="col"><h3>${nm(L.length)}</h3>${L.map(card).join('')}</div>`}
 const fm=K(cat,R_-1,0),ch=fm&&win(fm),p3=M['k_'+cat+'_P'];
 return h+`<div class="c"><div class="br">${cols}</div></div>${p3?`<div class="c"><h3>3.-4. postua</h3>${card({id:p3.id||`k_${cat}_P`,...p3,t:teams(p3)})}</div>`:''}${ch?`<div class="c champ"><h2>🏆 ${cat}: ${esc(tn(ch))}</h2></div>`:''}`}
const vR=()=>`<div class="c"><h2>Arautegia</h2><ul><li>Lau kategoria: Gazteak, Neskak, Herrikoia eta Irekia.</li><li>Lehen fasea taldeka da (3-4 bikote talde bakoitzean), zozketaz osatuak. Taldeko bikote guztiek elkarren aurka jokatzen dute.</li><li>Partidak 30 tantora dira.</li><li>Garaipen bakoitzak puntu 1 ematen du; porrotak ez du punturik. Berdinketa badago, tanto-aldeak (alde – aurka) erabakiko du.</li><li>Talde bakoitzeko 2 edo 3 bikote sailkatzen dira kanporaketara, kategoriaren arabera. Kanporaketak zuzenekoak dira.</li><li>Partidak astelehenetik ostiralera jokatzen dira Kontzejupean. Eguneko epailea bikoteen artean zozkatzen da, eta egun horretan ez du partidarik jokatzen.</li><li>Ordua partidu bakoitzean bikoteek adostu behar dute antolakuntzak emandako egunean. Aldaketak antolatzaileari jakinarazi.</li></ul></div>`;
function vA(){if(!db)return'<div class="warn">Firebase ez dago konfiguratuta. Itsatsi proiektuaren datuak <b>CFG</b>-n.</div>';
 if(!admin)return`<div class="c"><h2>Antolatzailea</h2><input id="em" type="email" placeholder="Posta elektronikoa"> <input id="pw" type="password" placeholder="Pasahitza"> <button onclick="A.login()">Sartu</button></div>`;
 return`<div class="c"><button class="o" onclick="A.out()">Irten</button></div><div class="c"><h2>Bikoteak gehitu</h2><select id="tc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><br><br><textarea id="tn" rows="5" style="width:100%" placeholder="Bikote bat lerroko (Izena1 / Izena2)"></textarea><br><br><button onclick="A.addT()">Gehitu</button></div>`+
 CATS.map(c=>{const ts=Object.entries(T).filter(([,t])=>t.cat==c).sort((a,b)=>a[1].name.localeCompare(b[1].name));return`<div class="c"><h2>${c} (${ts.length})</h2>
 <button onclick="A.draw('${c}')">Taldeak zozkatu</button> Sailkatzen dira taldeko: <select onchange="A.q('${c}',this.value)">${[1,2,3,4].map(n=>`<option ${n==(C.main?.q?.[c]||2)?'selected':''}>${n}</option>`).join('')}</select> <label><input type="checkbox" ${C.main?.p?.[c]?'checked':''} onchange="A.p('${c}',this.checked)"> 3.-4. partida</label> <button onclick="A.kn('${c}')">Kanporaketa sortu</button>
 <div style="margin-top:.6rem">${ts.map(([id,t])=>`<span class="bd" style="display:inline-block;margin:.15rem">${esc(t.name)}${t.group?' ('+t.group+')':''} <a href="#" onclick="A.delT('${id}');return false">✕</a></span>`).join('')}</div></div>`}).join('')}
function vH(){const ms=all(),pl=ms.filter(m=>m.t[0]&&m.t[1]),cmp=(a,b)=>(a.day+a.slot).localeCompare(b.day+b.slot),nx=pl.filter(m=>m.day&&m.day>=today()&&!played(m)).sort(cmp).slice(0,6),ls=pl.filter(m=>played(m)&&m.day).sort((a,b)=>cmp(b,a)).slice(0,4);
 const st=[[Object.keys(T).length,'Bikote'],[pl.filter(played).length+'/'+pl.length,'Partida jokatuak'],[nx[0]?fd(nx[0].day):'—','Hurrengo eguna']];
 const row=m=>`<div class="r"><span class="bd">${m.cat}</span><span>${esc(tn(m.t[0]))} <span class="m">vs</span> ${esc(tn(m.t[1]))}</span>${sc(m,false)}<span class="m">${fd(m.day)} · ${m.slot}</span></div>`;
 const pod=CATS.map(c=>{const fm=K(c,R(c)-1,0);if(!fm||!played(fm))return'';const p3=M['k_'+c+'_P'],cd=(t,e,k)=>`<div class="pd ${k}"><span style="font-size:1.7rem">${e}</span><div class="pdn">${t?esc(tn(t)):'—'}</div></div>`;
  return `<h3>${c}</h3><div class="pds">${cd(lose(fm),'🥈','')}${cd(win(fm),'🥇','p1')}${p3&&played(p3)?cd(win(p3),'🥉',''):'<div></div>'}</div>`}).join('');
 return `<div class="court"><img class="hl" src="${HERO}" alt=""><h2>Oiartzungo Pala Txapelketa</h2><p>Oiartzungo palaren lehia, egutegia eta sailkapena zuzenean. Jarraitu partidak, emaitzak eta txapeldunen bidea denboraldi osoan.</p><div class="hb"><button class="gd" onclick="A.tab('sailkapena')">Sailkapena</button><button class="gh" onclick="A.tab('egutegia')">Egutegia</button></div></div>
 <div class="sg">${st.map(([v,l])=>`<div class="c"><b>${v}</b><span class="m">${l}</span></div>`).join('')}</div>
 ${nx.length?`<div class="c"><h2>Hurrengo partidak</h2>${nx.map(row).join('')}</div>`:''}${ls.length?`<div class="c"><h2>Azken emaitzak</h2>${ls.map(row).join('')}</div>`:''}${pod?`<div class="c"><h2>Txapeldunak</h2>${pod}</div>`:''}`}
const V={hasiera:vH,sailkapena:vS,egutegia:vE,kanporaketak:vK,arautegia:vR,antolaketa:vA};
function render(){$('#nav').innerHTML=[['hasiera','Hasiera'],['sailkapena','Sailkapena'],['egutegia','Egutegia'],['kanporaketak','Kanporaketak'],['arautegia','Arautegia'],['antolaketa',admin?'Antolaketa ✓':'Antolaketa']].map(([k,l])=>`<button class="${k==tab?'on':''}" onclick="A.tab('${k}')">${l}</button>`).join('');$('#app').innerHTML=V[tab]()}
const rr=()=>{hl();if(document.activeElement?.matches('textarea,#em,#pw,#fr,#to,#af,#f,input[placeholder=Oharra]'))return;render()};
try{if(CFG.apiKey.startsWith('PEGA'))throw 0;const app=initializeApp(CFG);db=getFirestore(app);auth=getAuth(app);
 onAuthStateChanged(auth,u=>{admin=!!u;render()});
 [['teams',v=>T=v],['matches',v=>M=v],['days',v=>D=v],['config',v=>C=v]].forEach(([c,set])=>onSnapshot(collection(db,c),s=>{const o={};s.forEach(d=>o[d.id]=d.data());set(o);rr()}))}catch(e){db=null}
render();setTimeout(hl,1200);$('#fav').href=LOGO;
</script></body></html>
