const A=window.A={tab:t=>{tab=t;render()},cat:c=>{cat=c;render()},past:()=>{past=!past;render()},f:v=>{f=v.toLowerCase();render();const i=$('#f');if(i){i.focus();i.setSelectionRange(99,99)}},

 addT:async()=>{const n=$('#tn').value.split('\n').map(s=>s.trim()).filter(Boolean),c=$('#tc').value;await batch(n.map((name,i)=>['s','teams','t'+Date.now().toString(36)+i,{name,cat:c,group:''}]));$('#tn').value=''},
 delT:id=>confirm('Bikotea ezabatu? Taldeak berriz zozkatu beharko dira.')&&del('teams',id),
 q:(c,v)=>put('config','main',{q:{[c]:+v}}),p:(c,v)=>put('config','main',{p:{[c]:v}}),
 draw:async c=>{const ts=Object.keys(T).filter(i=>T[i].cat==c);if(ts.length<3)return alert('Gutxienez 3 bikote behar dira.');

  const s=ts.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]),g=Math.max(1,Math.round(s.length/3.5)),gs=Array.from({length:g},()=>[]);s.forEach((id,i)=>gs[i%g].push(id));
  const ops=Object.keys(M).filter(id=>M[id].cat==c).map(id=>['d','matches',id]);
  gs.forEach((q,gi)=>{const L=String.fromCharCode(65+gi);q.forEach(id=>ops.push(['s','teams',id,{group:L}]));q.forEach((a,x)=>q.slice(x+1).forEach(b=>ops.push(['s','matches',`g_${c}_${L}_${a}_${b}`,{cat:c,phase:'g',group:L,a,b}])))});

 kn:async c=>{const n=+(C.main?.q?.[c]||2),gl=groups(c);if(!gl.length)return alert('Lehenik taldeak zozkatu.');
  const tb=gl.map(g=>table(c,g)),sd=[];for(let p=0;p<n;p++)sd.push(...tb.map(t=>t[p]).filter(Boolean).sort((x,y)=>y.p-x.p||y.d-x.d).map(r=>r.id));
  if(sd.length<2)return alert('Ez dago bikote nahikorik.');let S=2;while(S<sd.length)S*=2;let o=[1];while(o.length<S)o=o.flatMap(x=>[x,2*o.length+1-x]);

 addD:async()=>{const a=$('#fr').value,b=$('#to').value,st=$('#st').value;if(!a||!b)return;const ops=[];for(let x=new Date(a+'T12:00');x<=new Date(b+'T12:00');x.setDate(x.getDate()+1)){const d=x.toISOString().slice(0,10);if(x.getDay()%6&&!D[d])ops.push(['s','days',d,{start:st}])}await batch(ops)},

 auto:async()=>{const from=$('#af').value||today(),ds=Object.keys(D).sort(),cnt={},ms=all(),by={},ops=[];
